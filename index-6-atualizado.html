<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ton Indicações</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F6F7;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;max-width:480px;margin:0 auto}
input,select,textarea{font-family:inherit}
.fab{position:fixed;bottom:20px;right:16px;z-index:160;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fab-main{width:56px;height:56px;border-radius:50%;background:#00A868;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(0,168,104,0.4);font-size:26px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.fab-red{width:44px;height:44px;border-radius:50%;background:#EF4444;border:none;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.2);font-size:20px;display:flex;align-items:center;justify-content:center}
.fab-item{display:flex;align-items:center;gap:8px;background:#fff;border:none;border-radius:24px;padding:10px 16px;box-shadow:0 4px 16px rgba(0,0,0,0.15);font-size:13px;font-weight:600;color:#1A1A2E;cursor:pointer}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:300}
.modal{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:360px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-title{font-size:15px;font-weight:800;color:#1A1A2E}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:#6B7280;line-height:1}
.card{background:#fff;border-radius:12px;padding:14px;border:1.5px solid #F0F0F0}
.btn-green{padding:13px;background:#00A868;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
.btn-outline{padding:11px 8px;background:transparent;color:#00A868;border:1.5px solid #00A868;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;flex:1}
.input{width:100%;padding:10px 12px;border-radius:8px;border:1.5px solid #E5E7EB;font-size:14px;outline:none;margin-bottom:10px;font-family:inherit}
.input:focus{border-color:#00A868}
label{font-size:12px;font-weight:600;color:#1A1A2E;display:block;margin-bottom:5px}
.tag{font-size:10px;padding:1px 7px;border-radius:99px;font-weight:600}
.progress-bar{background:rgba(255,255,255,0.2);border-radius:99px;height:7px}
.progress-fill{height:100%;border-radius:99px;transition:width 0.5s}
select{padding:8px 10px;border-radius:8px;border:1.5px solid #00A868;font-size:13px;font-weight:600;color:#00A868;background:#E6F7F1;outline:none;flex:1}
.menu-item{display:block;width:100%;text-align:left;padding:13px 20px;font-size:14px;border:none;cursor:pointer;border-left:3px solid transparent}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.row span:first-child{font-size:13px;color:#6B7280}
.row span:last-child{font-size:13px;font-weight:500}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:99px}
</style>
</head>
<body>

<div id="app"></div>

<script>
const C={verde:"#00A868",verdeEscuro:"#007A4C",verdeFundo:"#E6F7F1",cinza:"#F5F6F7",texto:"#1A1A2E",suave:"#6B7280",branco:"#fff",vermelho:"#EF4444",amarelo:"#F59E0B",azul:"#3B82F6"};

// Comissões dinâmicas — editáveis pelo usuário
function getComissoes(){return load("ton_comissoes",{Smart:240,T3:200,bonus:100,bonusCada:3});}
function COM(){return getComissoes();}
function BGRP(){return getComissoes().bonus;}
function BCADA(){return getComissoes().bonusCada;}
const FRASES=[
 {f:"A venda começa quando você entende o problema.",a:"Neil Rackham",t:"Diagnóstico: descubra o que mais incomoda o cliente antes de apresentar a máquina."},
 {f:"Disciplina é fazer hoje o que facilita o seu amanhã.",a:"Princípio comercial",t:"Bloco de prospecção: reserve 30 minutos só para novos contatos, sem distrações."},
 {f:"Quem pergunta bem, vende melhor.",a:"Princípio comercial",t:"Pergunta aberta: “Como você recebe hoje e o que gostaria de melhorar?”"},
 {f:"Constância transforma meta em resultado.",a:"Princípio comercial",t:"Meta reversa: divida a meta mensal em pequenas metas semanais e diárias."},
 {f:"O cliente compra clareza, não confusão.",a:"Princípio comercial",t:"Explique uma vantagem por vez e confirme se ela faz sentido para o cliente."},
 {f:"Toda conversa é uma oportunidade de aprender.",a:"Princípio comercial",t:"Anote a principal objeção do dia e prepare uma resposta melhor amanhã."},
 {f:"Velocidade sem direção só faz você chegar mais rápido no lugar errado.",a:"Princípio comercial",t:"Qualifique perfil, necessidade e momento de compra antes de insistir."},
 {f:"O follow-up é parte da venda, não um favor.",a:"Princípio comercial",t:"Regra 24h: retome o contato no dia seguinte e facilite o próximo passo."},
 {f:"Pequenas vitórias constroem grandes meses.",a:"Princípio comercial",t:"Micro-meta: conquiste a primeira venda do dia antes de pensar no número do mês."},
 {f:"A melhor oferta é aquela que resolve uma necessidade real.",a:"Princípio comercial",t:"Benefício antes do preço: mostre o ganho para o negócio antes de falar de valor."},
 {f:"Rejeição não é relatório final, é informação.",a:"Princípio comercial",t:"Pergunte o que impediria o cliente de avançar hoje."},
 {f:"Quem acompanha o próprio ritmo consegue corrigir a rota.",a:"Princípio comercial",t:"MTD: compare vendas acumuladas com o esperado para os dias úteis já passados."},
 {f:"Venda boa é aquela em que os dois lados enxergam valor.",a:"Princípio comercial",t:"Recapitule a necessidade do cliente e conecte-a diretamente à solução."},
 {f:"Não espere motivação para começar. Comece e deixe o resultado motivar.",a:"Princípio comercial",t:"Faça o contato mais difícil do dia antes de qualquer tarefa secundária."},
 {f:"A próxima venda pode estar escondida atrás da próxima pergunta.",a:"Princípio comercial",t:"Pergunta de expansão: “Você conhece outro comerciante que também poderia se beneficiar?”"},
 {f:"Resultado previsível nasce de comportamento previsível.",a:"Princípio comercial",t:"Mantenha horários fixos para prospecção, follow-up e pós-venda."},
 {f:"Seu melhor vendedor é o hábito que você repete.",a:"Princípio comercial",t:"Checklist: saudação → diagnóstico → solução → condição → fechamento → próximo passo."},
 {f:"Meta grande fica menor quando vira agenda.",a:"Princípio comercial",t:"Transforme sua meta de vendas em número de abordagens necessárias."},
 {f:"Não conte apenas vendas. Conte o processo que gera vendas.",a:"Princípio comercial",t:"Registre abordagens, propostas e fechamentos para descobrir onde está o gargalo."},
 {f:"Cada cliente atendido deixa uma pista para o próximo.",a:"Princípio comercial",t:"Registre uma frase que funcionou e use-a na próxima abordagem."}
];

function fmtR(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function fmtD(iso){return new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});}
function fmtDH(iso){return new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});}
function chStr(ano,mes){return ano+"-"+String(mes+1).padStart(2,"0");}
function nomeMesAno(ano,mes){return new Date(ano,mes,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});}
function hoje(){return new Date();}
function chAtual(){const d=hoje();return chStr(d.getFullYear(),d.getMonth());}

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}

function getDiasUteisRest(){
  const h=hoje(),fim=new Date(h.getFullYear(),h.getMonth()+1,0);
  let d=0,x=new Date(h);x.setDate(x.getDate()+1);
  while(x<=fim){if(x.getDay()!==0&&x.getDay()!==6)d++;x.setDate(x.getDate()+1);}return d;
}
function getDiasSabRest(){
  const h=hoje(),fim=new Date(h.getFullYear(),h.getMonth()+1,0);
  let d=0,x=new Date(h);x.setDate(x.getDate()+1);
  while(x<=fim){if(x.getDay()!==0)d++;x.setDate(x.getDate()+1);}return d;
}

function getWorkdaysInfo(ano,mes){
  const totalDays=new Date(ano,mes+1,0).getDate(),now=hoje();
  const isCurrent=ano===now.getFullYear()&&mes===now.getMonth();
  const through=isCurrent?now.getDate():totalDays;
  let total=0,elapsed=0;
  for(let d=1;d<=totalDays;d++){
    const wd=new Date(ano,mes,d).getDay()!==0&&new Date(ano,mes,d).getDay()!==6;
    if(wd){total++;if(d<=through)elapsed++;}
  }
  return {total,elapsed,remaining:Math.max(0,total-elapsed),totalDays,through,isCurrent};
}
function dataVendaIso(valor){
  if(!valor)return new Date().toISOString();
  const p=String(valor).split('-').map(Number);
  if(p.length!==3||!p[0]||!p[1]||!p[2])return new Date().toISOString();
  return new Date(p[0],p[1]-1,p[2],12,0,0).toISOString();
}
function dataVendaInput(r){
  const d=r?.dataVenda||r?.data;if(!d)return '';
  const x=new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
}
function vendaCh(r){
  if(r.mes&&!r.dataVenda)return r.mes;
  const x=new Date(r.dataVenda||r.data);
  return chStr(x.getFullYear(),x.getMonth());
}

// ── STATE ────────────────────────────────────────────────────────────────────
let state={
  registros:load("ton_registros",[]),
  metas:load("ton_metas",{}),
  jornadas:load("ton_jornadas",[]),
  jornadaAtiva:load("ton_jornada_ativa",null),
  contatos:load("ton_contatos",{}),
  aba:"dashboard",
  subAba:"cliente",
  menuAberto:false,
  showFAB:false,
  showModalMeta:false,
  showModalEditMeta:false,
  showModalCliente:false,
  editandoCliente:null,
  showModalJornada:false,
  confirmarDel:null,
  selReg:{ano:hoje().getFullYear(),mes:hoje().getMonth()},
  selMeta:{ano:hoje().getFullYear(),mes:hoje().getMonth()},
  selRel:{ano:hoje().getFullYear(),mes:hoje().getMonth()},
  selMapa:{ano:hoje().getFullYear(),mes:hoje().getMonth()},
  selJornada:{ano:hoje().getFullYear(),mes:hoje().getMonth()},
  mapaTodos:false,
};

function setState(patch){
  Object.assign(state,patch);
  if(patch.registros)save("ton_registros",state.registros);
  if(patch.metas)save("ton_metas",state.metas);
  if(patch.jornadas)save("ton_jornadas",state.jornadas);
  if(patch.jornadaAtiva!==undefined)save("ton_jornada_ativa",state.jornadaAtiva);
  if(patch.contatos)save("ton_contatos",state.contatos);
  render();
}

// ── HELPERS ──────────────────────────────────────────────────────────────────
function calcMes(ch){
  const cli=state.registros.filter(r=>vendaCh(r)===ch&&r.tipo==="cliente");
  const be=state.registros.filter(r=>r.mes===ch&&r.tipo==="bonus_extra");
  const com=cli.reduce((s,r)=>s+(r.comissao!=null?r.comissao:(COM()[r.equipamento]||0)),0);
  const bauto=Math.floor(cli.length/BCADA())*BGRP();
  const bext=be.reduce((s,r)=>s+(r.valor||0),0);
  const rawMeta=state.metas[ch]||{};
  const metaVendas=Number(rawMeta.vendas ?? (((rawMeta.smart||0)+(rawMeta.t3||0)) || 0));
  const mediaAtual=cli.length>0?com/cli.length:(COM().Smart+COM().T3)/2;
  const metaFinanceira=Number(rawMeta.valor||0)>0?Number(rawMeta.valor):metaVendas*mediaAtual;
  const meta={...rawMeta,vendas:metaVendas,valor:metaFinanceira};
  const total=com+bauto+bext;
  return {cli,be,com,bauto,bext,total,meta,
    smart:cli.filter(r=>r.equipamento==="Smart").length,
    t3:cli.filter(r=>r.equipamento==="T3").length,
    pct:metaFinanceira>0?Math.min(100,(total/metaFinanceira)*100):0,
    vendasPct:metaVendas>0?Math.min(100,(cli.length/metaVendas)*100):0};
}

// ── ACTIONS ──────────────────────────────────────────────────────────────────
function addCliente(d){
  const venda=dataVendaIso(d.dataVenda),dv=new Date(venda);
  const novo={id:Date.now(),tipo:"cliente",...d,data:new Date().toISOString(),dataVenda:venda,mes:chStr(dv.getFullYear(),dv.getMonth())};
  setState({registros:[novo,...state.registros],showModalCliente:false,showFAB:false});
}
function editCliente(id,d){
  setState({registros:state.registros.map(r=>{
    if(r.id!==id)return r;
    const venda=dataVendaIso(d.dataVenda||dataVendaInput(r)),dv=new Date(venda);
    return {...r,...d,dataVenda:venda,mes:chStr(dv.getFullYear(),dv.getMonth()),comissao:COM()[d.equipamento]};
  }),editandoCliente:null});
}
function addBonusExtra(tipo,val,mes){
  const novo={id:Date.now(),tipo:"bonus_extra",bonusTipo:tipo,valor:val,data:new Date().toISOString(),mes:mes||chAtual()};
  setState({registros:[novo,...state.registros]});
}
function deletar(id){setState({registros:state.registros.filter(r=>r.id!==id),confirmarDel:null});}
function salvarMeta(m,comData){
  const targetCh=chStr(state.selMeta.ano,state.selMeta.mes);
  const vendas=Math.max(0,parseInt(m.vendas)||0);
  const obj={vendas,cadastradoEm:comData?new Date().toISOString():(state.metas[targetCh]?.cadastradoEm||new Date().toISOString())};
  setState({metas:{...state.metas,[targetCh]:obj},showModalMeta:false,showModalEditMeta:false});
}
function iniciarJornada(){
  const j={id:Date.now(),inicio:new Date().toISOString(),fim:null,mes:chAtual()};
  setState({jornadaAtiva:j,showModalJornada:false});
}
function finalizarJornada(){
  if(!state.jornadaAtiva)return;
  const fim=new Date().toISOString();
  const dur=(new Date(fim)-new Date(state.jornadaAtiva.inicio))/60000;
  const completa={...state.jornadaAtiva,fim,duracaoMin:Math.round(dur)};
  setState({jornadas:[completa,...state.jornadas],jornadaAtiva:null,showModalJornada:false});
}
function editarJornada(id,novoInicio,novoFim){
  const inicio=new Date(novoInicio),fim=new Date(novoFim);
  if(isNaN(inicio)||isNaN(fim)||fim<=inicio)return alert("Confira os horários da jornada.");
  setState({jornadas:state.jornadas.map(j=>j.id===id?{...j,inicio:inicio.toISOString(),fim:fim.toISOString(),duracaoMin:Math.round((fim-inicio)/60000),mes:chStr(inicio.getFullYear(),inicio.getMonth())}:j),editandoJornada:null});
}
function dtLocal(iso){
  const d=new Date(iso),pad=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function renderModalEditJornada(j){
  let ini=dtLocal(j.inicio),fim=dtLocal(j.fim||new Date().toISOString());
  const iIni=h("input",{type:"datetime-local",value:ini,style:{width:"100%",padding:"10px",borderRadius:"8px",border:"1.5px solid #E5E7EB",fontFamily:"inherit",marginBottom:"10px"}});
  const iFim=h("input",{type:"datetime-local",value:fim,style:{width:"100%",padding:"10px",borderRadius:"8px",border:"1.5px solid #E5E7EB",fontFamily:"inherit",marginBottom:"12px"}});
  iIni.addEventListener("input",e=>ini=e.target.value);iFim.addEventListener("input",e=>fim=e.target.value);
  return modalWrap("✏️ Ajustar Jornada",()=>setState({editandoJornada:null}),lbl("Início"),iIni,lbl("Fim"),iFim,btn("Salvar horários",()=>editarJornada(j.id,ini,fim),{width:"100%",padding:"13px",background:C.verde,color:C.branco,borderRadius:"10px",fontSize:"14px",fontWeight:"700"}));
}

function exportar(){
  const blob=new Blob([JSON.stringify({registros:state.registros,metas:state.metas,jornadas:state.jornadas,exportadoEm:new Date().toISOString()},null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="ton-backup-"+new Date().toISOString().split("T")[0]+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function importar(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.registros||!d.metas)throw 0;
      if(confirm("Importar backup? Substituirá os dados atuais.")){
        setState({registros:d.registros,metas:d.metas,jornadas:d.jornadas||[]});
        alert("Importado com sucesso!");
      }
    }catch{alert("Arquivo inválido.");}
  };
  reader.readAsText(file);
}

// ── HTML BUILDERS ─────────────────────────────────────────────────────────────
function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(el.style,v);
    else if(k.startsWith("on"))el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="html")el.innerHTML=v;
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null||c===false)return;
    el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
  });
  return el;
}
function div(style,...ch){return h("div",{style},...ch);}
function btn(txt,onclick,style){return h("button",{onclick,style:Object.assign({cursor:"pointer",border:"none",fontFamily:"inherit",fontSize:13},style||{})},txt);}
function inp(placeholder,value,oninput,style){
  const el=h("input",{placeholder,style:Object.assign({width:"100%",padding:"10px 12px",borderRadius:"8px",border:"1.5px solid #E5E7EB",fontSize:"14px",outline:"none",marginBottom:"10px",fontFamily:"inherit"},style||{})});
  el.value=value||"";
  el.addEventListener("input",oninput);
  return el;
}
function lbl(txt){return h("label",{style:{fontSize:"12px",fontWeight:"600",color:C.texto,display:"block",marginBottom:"5px"}},txt);}
function row(label,valor,cor,bold){
  return div({display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"},
    h("span",{style:{fontSize:"13px",color:C.suave}},label),
    h("span",{style:{fontSize:"13px",fontWeight:bold?"700":"500",color:cor||C.texto}},valor)
  );
}
function card(...ch){return div({background:C.branco,borderRadius:"12px",padding:"14px",border:"1.5px solid #F0F0F0",marginBottom:"12px"},...ch);}
function section(titulo,...ch){
  return div({background:C.branco,borderRadius:"12px",padding:"16px",marginBottom:"12px"},
    div({fontSize:"12px",fontWeight:"700",color:C.texto,marginBottom:"10px"},titulo),
    ...ch
  );
}

function mesAnoSel(ano,mes,onChange){
  const meses=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const anos=[2026,2027,2028];
  const wrap=div({display:"flex",gap:"8px",marginBottom:"12px"});
  const sm=h("select",{});
  meses.forEach((m,i)=>{const o=h("option",{value:i},m);if(i===mes)o.selected=true;sm.appendChild(o);});
  sm.addEventListener("change",e=>onChange(ano,parseInt(e.target.value)));
  const sa=h("select",{});
  anos.forEach(a=>{const o=h("option",{value:a},String(a));if(a===ano)o.selected=true;sa.appendChild(o);});
  sa.addEventListener("change",e=>onChange(parseInt(e.target.value),mes));
  wrap.appendChild(sm);wrap.appendChild(sa);
  return wrap;
}

// ── MODAL HELPERS ─────────────────────────────────────────────────────────────
function modalWrap(titulo,onClose,...children){
  const bg=div({position:"fixed",inset:"0",background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",padding:"16px",zIndex:"300"});
  const box=div({background:C.branco,borderRadius:"16px",padding:"20px",width:"100%",maxWidth:"360px",maxHeight:"90vh",overflowY:"auto"});
  const hdr=div({display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"},
    h("div",{style:{fontSize:"15px",fontWeight:"800",color:C.texto}},titulo),
    btn("✕",onClose,{background:"none",fontSize:"22px",color:C.suave,lineHeight:"1"})
  );
  box.appendChild(hdr);
  children.forEach(c=>{if(c)box.appendChild(c);});
  bg.appendChild(box);
  return bg;
}

// ── RENDER MODAL META ─────────────────────────────────────────────────────────
function renderModalMeta(isEdit){
  const metaCh=chStr(state.selMeta.ano,state.selMeta.mes);
  const ini=isEdit?(state.metas[metaCh]||null):null;
  let vendas=Number(ini?.vendas ?? (((ini?.smart||0)+(ini?.t3||0)) || 0));
  const preview=div({background:C.verdeFundo,borderRadius:"10px",padding:"14px",marginBottom:"16px",textAlign:"center"});
  function updatePreview(){
    const media=(COM().Smart+COM().T3)/2;
    const estimativa=vendas*media;
    preview.innerHTML="";
    preview.appendChild(h("div",{style:{fontSize:"11px",color:C.verdeEscuro}},"Estimativa financeira"));
    preview.appendChild(h("div",{style:{fontSize:"22px",fontWeight:"800",color:C.verde}},fmtR(estimativa)));
    preview.appendChild(h("div",{style:{fontSize:"10px",color:C.suave}},"baseada na média atual das comissões · bônus à parte"));
    preview.style.display=vendas>0?"block":"none";
  }
  const iVendas=h("input",{type:"number",min:"1",step:"1",placeholder:"36",style:{width:"100%",padding:"14px 12px",borderRadius:"10px",border:"2px solid "+C.verde,fontSize:"26px",fontWeight:"800",textAlign:"center",outline:"none",fontFamily:"inherit"}});

function renderDashboard(){
  const ch=chAtual();const m=calcMes(ch);
  const diasR=getDiasUteisRest();const diasS=getDiasSabRest();
  const falta=Math.max(0,m.meta.valor-m.total);
  const pct=m.pct;
  const bateu=m.total>=m.meta.valor&&m.meta.valor>0;
  const mediaCom=m.cli.length>0?m.com/m.cli.length:220;
  const vParaMeta=falta>0?Math.ceil(falta/(mediaCom+BGRP()/BCADA())):0;
  const mDia=diasR>0?(vParaMeta/diasR).toFixed(1):"0";
  const mSab=diasS>0?(vParaMeta/diasS).toFixed(1):"0";
  const proxBonus=m.cli.length%BCADA()===0?3:BCADA()-(m.cli.length%BCADA());
  const frase=FRASES[hoje().getDate()%FRASES.length];

  const posHoje=state.registros.filter(r=>r.tipo==="cliente").filter(r=>{
    const d=Math.floor((hoje()-new Date(r.dataVenda||r.data))/86400000);

  const wrap=div({display:"flex",flexDirection:"column",gap:"12px"});

  // Cards

      div({fontSize:"20px",fontWeight:"800",color:bg?C.branco:cor,lineHeight:"1"},valor),
      sub?div({fontSize:"10px",color:bg?"rgba(255,255,255,0.7)":"#9CA3AF",marginTop:"3px"},sub):null

  grid.append(

    bigCard("Meta de vendas",m.meta.vendas||0,bateu?"🎉 Meta batida!":"vendas no mês",null,bateu?C.verde:C.texto),
    bigCard("Ganhos",fmtR(m.total),"comissões + bônus",null,C.verde),

  // MTD — Month To Date

    const esperado= m.meta.vendas*(wi.elapsed/Math.max(1,wi.total));
    const realizadas=m.cli.length;
    const variacao=realizadas-esperado;
    const ritmoAtual=wi.elapsed>0?realizadas/wi.elapsed:0;
    const ritmoNecessario=wi.remaining>0?Math.max(0,(m.meta.vendas-realizadas)/wi.remaining):0;
    const pctMTD=Math.min(100,(realizadas/Math.max(1,m.meta.vendas))*100);
    const status=variacao>=0?"▲ Dentro do ritmo MTD":"▼ Abaixo do ritmo MTD";

    mtd.appendChild(div({display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px"},div({fontSize:"12px",fontWeight:"800",color:C.texto},"📈 MTD — Vendas"),div({fontSize:"10px",fontWeight:"800",color:variacao>=0?C.verde:C.vermelho},status)));

    bar.appendChild(div({width:pctMTD+"%",height:"100%",background:C.verde,borderRadius:"99px"}));
    const marcador=div({position:"absolute",left:Math.min(100,(esperado/Math.max(1,m.meta.vendas))*100)+"%",top:"-2px",width:"2px",height:"14px",background:C.texto});
    bar.appendChild(marcador);mtd.appendChild(bar);
    const nums=div({display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"6px",marginTop:"10px",textAlign:"center"});

    wrap.appendChild(ritmo);

  // Detalhamento

  det.appendChild(h("div",{style:{borderTop:"1px solid "+C.cinza,marginTop:"6px",paddingTop:"6px"}}));
  det.appendChild(row("Total do mês",fmtR(m.total),C.verde,true));
  wrap.appendChild(det);

  // Pós-venda alerta
  if(posHoje.length>0){
    const pv=div({background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:"12px",padding:"14px"});
    pv.appendChild(div({fontSize:"12px",fontWeight:"700",color:"#C2410C",marginBottom:"6px"},"🔔 Pós-venda hoje ("+posHoje.length+")"));
    posHoje.forEach(r=>{
      const d=Math.floor((hoje()-new Date(r.dataVenda||r.data))/86400000);
      pv.appendChild(div({fontSize:"12px",color:"#92400E",marginBottom:"3px"},"• "+r.nome+" – "+d+" dias"));
    });
    const bpv=btn("Ver tudo →",()=>setState({aba:"posvendas"}),{background:"none",border:"1px solid #FED7AA",borderRadius:"6px",padding:"4px 10px",color:"#C2410C",fontSize:"11px",marginTop:"6px"});
    pv.appendChild(bpv);
    wrap.appendChild(pv);

  // Motivação
  const mot=div({background:C.branco,borderRadius:"12px",padding:"16px",borderLeft:"3px solid "+C.verde});
  mot.appendChild(div({fontSize:"10px",fontWeight:"700",color:C.verde,textTransform:"uppercase",letterSpacing:"1px",marginBottom:"8px"},"✨ Motivação do Dia"));
  mot.appendChild(div({fontSize:"13px",fontStyle:"italic",color:C.texto,lineHeight:"1.5",marginBottom:"4px"},'"'+frase.f+'"'));

  tec.appendChild(div({fontSize:"11px",color:C.suave,lineHeight:"1.5"},frase.t));

  wrap.appendChild(mot);

  // Backup
  const bk=div({background:C.branco,borderRadius:"12px",padding:"16px"});
  bk.appendChild(div({fontSize:"11px",fontWeight:"700",color:C.texto,marginBottom:"8px"},"💾 Backup"));

  bkRow.appendChild(btn("⬇️ Exportar",exportar,{flex:"1",padding:"9px 8px",background:C.verde,color:C.branco,borderRadius:"8px",fontWeight:"600"}));
  const fileInp=h("input",{type:"file",accept:"application/json",style:{display:"none"}});

  const btnImp=btn("⬆️ Importar",()=>fileInp.click(),{flex:"1",padding:"9px 8px",background:"transparent",color:C.verde,border:"1.5px solid "+C.verde,borderRadius:"8px",fontWeight:"600"});
  bkRow.append(btnImp,fileInp);
  bk.appendChild(bkRow);
  wrap.appendChild(bk);

  return wrap;

function renderCalendario(){
  const {ano,mes}=state.selReg;
  const ch=chStr(ano,mes);
  const wrap=div({background:C.branco,borderRadius:"12px",padding:"14px"});
  wrap.appendChild(mesAnoSel(ano,mes,(a,m)=>setState({selReg:{ano:a,mes:m}})));
  const nav=div({display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"10px"});
  nav.appendChild(btn("‹",()=>{const d=new Date(ano,mes-1,1);setState({selReg:{ano:d.getFullYear(),mes:d.getMonth()}});},{background:"none",fontSize:"22px",color:C.verde}));
  nav.appendChild(div({fontSize:"14px",fontWeight:"700",color:C.texto,textTransform:"capitalize"},nomeMesAno(ano,mes)));
  nav.appendChild(btn("›",()=>{const d=new Date(ano,mes+1,1);setState({selReg:{ano:d.getFullYear(),mes:d.getMonth()}});},{background:"none",fontSize:"22px",color:C.verde}));
  wrap.appendChild(nav);
  const diasNome=["D","S","T","Q","Q","S","S"];
  const hdr=div({display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"2px",marginBottom:"4px"});
  diasNome.forEach(d=>hdr.appendChild(div({textAlign:"center",fontSize:"10px",fontWeight:"700",color:C.suave,padding:"4px 0"},d)));
  wrap.appendChild(hdr);
  const grid=div({display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px"});
  const primeiro=new Date(ano,mes,1);
  const ultimo=new Date(ano,mes+1,0);
  for(let i=0;i<primeiro.getDay();i++)grid.appendChild(div({}));
  const cliM=state.registros.filter(r=>r.tipo==="cliente"&&vendaCh(r)===ch);
  const beM=state.registros.filter(r=>r.tipo==="bonus_extra"&&r.mes===ch);
  const h2=hoje();
  for(let d=1;d<=ultimo.getDate();d++){
    const ds=ch+"-"+String(d).padStart(2,"0");
    const vD=cliM.filter(r=>r.data.startsWith(ds));
    const bD=beM.filter(r=>r.data.startsWith(ds));
    const tot=vD.reduce((s,r)=>s+(COM()[r.equipamento]||0),0)+bD.reduce((s,r)=>s+(r.valor||0),0);
    const isH=ano===h2.getFullYear()&&mes===h2.getMonth()&&d===h2.getDate();
    const temV=vD.length>0||bD.length>0;
    const cell=div({borderRadius:"8px",padding:"5px 3px",textAlign:"center",background:isH?C.verde:temV?C.verdeFundo:C.branco,border:isH?"none":temV?"1px solid "+C.verde+"40":"1px solid #F0F0F0",minHeight:"58px",cursor:temV?"pointer":"default",overflow:"hidden"});
    cell.addEventListener("click",()=>temV&&setState({selCalendarioDia:ds}));
    cell.appendChild(div({fontSize:"11px",fontWeight:isH?"800":"600",color:isH?C.branco:temV?C.verdeEscuro:C.suave},String(d)));
    if(temV){
      cell.appendChild(div({fontSize:"10px",fontWeight:"800",color:isH?C.branco:C.verde,marginTop:"3px"},vD.length?vD.length+" venda"+(vD.length>1?"s":""):"Bônus"));
      cell.appendChild(div({fontSize:"9px",fontWeight:"600",color:isH?"rgba(255,255,255,0.8)":C.suave,marginTop:"2px",whiteSpace:"nowrap"},fmtR(tot)));
    }
    grid.appendChild(cell);
  }
  wrap.appendChild(grid);
  if(state.selCalendarioDia&&state.selCalendarioDia.startsWith(ch)){
    const dia=state.selCalendarioDia;
    const vendasDia=cliM.filter(r=>dataVendaInput(r)===dia);
    const bonusDia=beM.filter(r=>r.data.startsWith(dia));
    const det=div({background:C.cinza,borderRadius:"10px",padding:"12px",marginTop:"12px"});

      left.appendChild(div({fontSize:"13px",fontWeight:"800",color:C.texto,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"},r.nome));
      left.appendChild(div({fontSize:"10px",color:C.suave},r.bairro+" · "+r.equipamento+" · venda em "+new Date(r.dataVenda||r.data).toLocaleDateString("pt-BR")));
      left.appendChild(div({fontSize:"10px",color:reg?C.verde:"#C2410C",fontWeight:"700",marginTop:"4px"},reg?"✅ Contatado · satisfação "+reg.satisfacao:"⚠️ Pendente: contato ainda não registrado"));
      const right=div({display:"flex",flexDirection:"column",gap:"5px",alignItems:"flex-end",flexShrink:"0"});
      if(r.whatsapp)right.appendChild(h("a",{href:"https://wa.me/"+r.whatsapp,target:"_blank",style:{fontSize:"10px",background:"#25D366",color:C.branco,padding:"5px 9px",borderRadius:"6px",textDecoration:"none",fontWeight:"700"}},reg?"WhatsApp":"📲 Reparar contato"));
      if(!reg){
        const emojis=div({display:"flex",gap:"3px"});
        ["😊","😐","😞"].forEach(x=>emojis.appendChild(btn(x,()=>setState({contatos:{...state.contatos,[key]:{data:new Date().toISOString(),satisfacao:x}}}),{background:"none",border:"1px solid #E5E7EB",borderRadius:"6px",padding:"3px 6px",fontSize:"13px"})));
        right.appendChild(emojis);
      }
      top.append(left,right);c.appendChild(top);sec.appendChild(c);
    });
    wrap.appendChild(sec);
  });
  if(feedbacks.length){
    const fb=section("💬 Feedbacks registrados");
    feedbacks.slice().reverse().forEach(r=>{
      Object.entries(state.contatos).filter(([k])=>k.startsWith(r.id+"_")).forEach(([k,v])=>{
        fb.appendChild(div({padding:"8px 0",borderBottom:"1px solid "+C.cinza},
          div({fontSize:"11px",fontWeight:"700"},r.nome+" · "+k.split("_").pop()+" dias"),
          div({fontSize:"10px",color:C.suave},v.satisfacao+" · "+new Date(v.data).toLocaleDateString("pt-BR"))));
      });
    });
    wrap.appendChild(fb);
  }
  return wrap;
}

// ── TELA MAPA ─────────────────────────────────────────────────────────────────
function renderMapa(){
  const {ano,mes}=state.selMapa;
  const ch=chStr(ano,mes);
  const cliF=state.mapaTodos
    ?state.registros.filter(r=>r.tipo==="cliente"&&r.cep)
    :state.registros.filter(r=>r.tipo==="cliente"&&r.cep&&r.mes===ch);
  const wrap=div({display:"flex",flexDirection:"column",gap:"12px"});
  const top=div({display:"flex",gap:"8px",alignItems:"flex-end"});
  const selWrap=div({flex:"1"});
  selWrap.appendChild(mesAnoSel(ano,mes,(a,m)=>{setState({selMapa:{ano:a,mes:m},mapaTodos:false});}));
  const btnT=btn(state.mapaTodos?"✓ Todos":"Todos",()=>setState({mapaTodos:!state.mapaTodos}),{padding:"8px 12px",background:state.mapaTodos?C.verde:"transparent",color:state.mapaTodos?C.branco:C.verde,border:"1.5px solid "+C.verde,borderRadius:"8px",fontSize:"12px",fontWeight:"700",whiteSpace:"nowrap",marginBottom:"12px"});
  top.append(selWrap,btnT);
  wrap.appendChild(top);
  const box=div({background:C.branco,borderRadius:"12px",padding:"16px"});
  box.appendChild(div({fontSize:"12px",fontWeight:"700",color:C.texto,marginBottom:"10px"},"📍 "+cliF.length+" cliente"+(cliF.length!==1?"s":"")+" com CEP "+(state.mapaTodos?"(todos)":"("+nomeMesAno(ano,mes)+")")));
  if(cliF.length===0){
    box.appendChild(div({textAlign:"center",color:C.suave,padding:"20px 0",fontSize:"13px"},"Nenhum cliente com CEP cadastrado"));
  } else {
    cliF.forEach(r=>{
      const it=div({display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:"1px solid "+C.cinza});
      it.appendChild(div({},div({fontSize:"13px",fontWeight:"600",color:C.texto},r.nome),div({fontSize:"11px",color:C.suave},r.bairro+" · CEP "+r.cep+" · "+r.equipamento)));
      it.appendChild(btn("📍 Ver",()=>window.open("https://www.google.com/maps/search/"+r.cep+"+Brasil","_blank"),{background:C.verde,color:C.branco,border:"none",borderRadius:"8px",padding:"7px 12px",fontSize:"12px",fontWeight:"600",whiteSpace:"nowrap"}));
      box.appendChild(it);
    });
    box.appendChild(btn("🗺️ Abrir Todos",()=>window.open("https://www.google.com/maps/search/"+cliF.map(r=>r.cep).join("|")+"+Brasil","_blank"),{width:"100%",marginTop:"12px",padding:"10px",background:C.azul,color:C.branco,border:"none",borderRadius:"8px",fontSize:"13px",fontWeight:"700"}));
  }
  wrap.appendChild(box);
  return wrap;
}

// ── TELA COMISSÕES ────────────────────────────────────────────────────────────
function renderComissoes(){
  const atual=getComissoes();
  let vSmart=atual.Smart, vT3=atual.T3, vBonus=atual.bonus, vCada=atual.bonusCada;
  const wrap=div({display:"flex",flexDirection:"column",gap:"12px"});

  // Card info atual
  const info=div({background:C.verde,borderRadius:"12px",padding:"16px",color:C.branco});
  info.appendChild(div({fontSize:"11px",opacity:"0.8",textTransform:"uppercase",letterSpacing:"1px",marginBottom:"4px"},"Valores Atuais"));
  info.appendChild(div({display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"6px",marginTop:"10px"},
    div({textAlign:"center",minWidth:"0"},div({fontSize:"10px",color:"rgba(255,255,255,0.8)"},"Smart"),div({fontSize:"20px",fontWeight:"800",whiteSpace:"nowrap"},fmtR(atual.Smart))),
    div({textAlign:"center",minWidth:"0"},div({fontSize:"10px",color:"rgba(255,255,255,0.8)"},"T3"),div({fontSize:"20px",fontWeight:"800",whiteSpace:"nowrap"},fmtR(atual.T3))),
    div({textAlign:"center",minWidth:"0"},div({fontSize:"10px",color:"rgba(255,255,255,0.8)"},"Bônus / ciclo"),div({fontSize:"18px",fontWeight:"800",whiteSpace:"nowrap"},fmtR(atual.bonus)),div({fontSize:"9px",color:"rgba(255,255,255,0.75)"},"a cada "+atual.bonusCada+" vendas"))
  ));
  wrap.appendChild(info);

  // Formulário de edição
  const form=div({background:C.branco,borderRadius:"12px",padding:"16px"});
  form.appendChild(div({fontSize:"13px",fontWeight:"700",color:C.texto,marginBottom:"14px"},"✏️ Editar Valores"));

  // Smart
  form.appendChild(div({fontSize:"12px",fontWeight:"600",color:C.texto,marginBottom:"5px"},"Comissão Smart (R$)"));
  const iSmart=h("input",{type:"number",min:"0",placeholder:"240",style:{width:"100%",padding:"11px 12px",borderRadius:"8px",border:"1.5px solid "+C.verde,fontSize:"16px",fontWeight:"700",outline:"none",marginBottom:"12px",fontFamily:"inherit"}});
  iSmart.value=vSmart;
  iSmart.addEventListener("input",e=>vSmart=parseFloat(e.target.value)||0);
  form.appendChild(iSmart);

  // T3
  form.appendChild(div({fontSize:"12px",fontWeight:"600",color:C.texto,marginBottom:"5px"},"Comissão T3 (R$)"));
  const iT3=h("input",{type:"number",min:"0",placeholder:"200",style:{width:"100%",padding:"11px 12px",borderRadius:"8px",border:"1.5px solid "+C.azul,fontSize:"16px",fontWeight:"700",outline:"none",marginBottom:"12px",fontFamily:"inherit"}});
  iT3.value=vT3;
  iT3.addEventListener("input",e=>vT3=parseFloat(e.target.value)||0);
  form.appendChild(iT3);

  // Divisor
  const div2=div({height:"1px",background:C.cinza,margin:"4px 0 14px"});
  form.appendChild(div2);

  // Bônus valor
  form.appendChild(div({fontSize:"12px",fontWeight:"600",color:C.texto,marginBottom:"5px"},"Valor do Bônus Automático (R$)"));
  const iBonus=h("input",{type:"number",min:"0",placeholder:"100",style:{width:"100%",padding:"11px 12px",borderRadius:"8px",border:"1.5px solid "+C.amarelo,fontSize:"16px",fontWeight:"700",outline:"none",marginBottom:"12px",fontFamily:"inherit"}});
  iBonus.value=vBonus;
  iBonus.addEventListener("input",e=>vBonus=parseFloat(e.target.value)||0);
  form.appendChild(iBonus);

  // Bônus a cada X vendas
  form.appendChild(div({fontSize:"12px",fontWeight:"600",color:C.texto,marginBottom:"5px"},"Bônus a cada quantas vendas?"));
  const iCada=h("input",{type:"number",min:"1",placeholder:"3",style:{width:"100%",padding:"11px 12px",borderRadius:"8px",border:"1.5px solid "+C.amarelo,fontSize:"16px",fontWeight:"700",outline:"none",marginBottom:"16px",fontFamily:"inherit"}});
  iCada.value=vCada;
  iCada.addEventListener("input",e=>vCada=parseInt(e.target.value)||1);
  form.appendChild(iCada);

  // Preview
  const prev=div({background:C.verdeFundo,borderRadius:"8px",padding:"12px",marginBottom:"14px"});
  prev.appendChild(div({fontSize:"11px",color:C.verdeEscuro,fontWeight:"600",marginBottom:"6px"},"📊 Exemplo com esses valores"));
  prev.appendChild(div({fontSize:"12px",color:C.suave,lineHeight:"1.8"},
    "3 Smart → "+fmtR(3*vSmart)+" + bônus "+fmtR(Math.floor(3/vCada)*vBonus)+" = "+fmtR(3*vSmart+Math.floor(3/vCada)*vBonus)
  ));
  form.appendChild(prev);

  // Atualizar preview ao digitar
  [iSmart,iT3,iBonus,iCada].forEach(el=>{
    el.addEventListener("input",()=>{
      prev.innerHTML="";
      prev.appendChild(div({fontSize:"11px",color:C.verdeEscuro,fontWeight:"600",marginBottom:"6px"},"📊 Exemplo com esses valores"));
      const ex3s=3*vSmart+Math.floor(3/Math.max(1,vCada))*vBonus;
      const ex3t=3*vT3+Math.floor(3/Math.max(1,vCada))*vBonus;
      prev.appendChild(div({fontSize:"12px",color:C.suave,lineHeight:"1.8"},"3 Smart → "+fmtR(3*vSmart)+" + bônus "+fmtR(Math.floor(3/Math.max(1,vCada))*vBonus)+" = "+fmtR(ex3s)));
      prev.appendChild(div({fontSize:"12px",color:C.suave,lineHeight:"1.8"},"3 T3 → "+fmtR(3*vT3)+" + bônus "+fmtR(Math.floor(3/Math.max(1,vCada))*vBonus)+" = "+fmtR(ex3t)));
    });
  });

  // Botão salvar
  form.appendChild(btn("💾 Salvar Valores",()=>{
    if(vSmart<=0||vT3<=0||vBonus<=0||vCada<1){alert("Preencha todos os valores corretamente.");return;}
    save("ton_comissoes",{Smart:vSmart,T3:vT3,bonus:vBonus,bonusCada:vCada});
    alert("✅ Valores atualizados com sucesso!");
    render();
  },{width:"100%",padding:"13px",background:C.verde,color:C.branco,borderRadius:"10px",fontSize:"15px",fontWeight:"700"}));

  wrap.appendChild(form);

  // Histórico / aviso
  const aviso=div({background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:"12px",padding:"14px"});
  aviso.appendChild(div({fontSize:"12px",fontWeight:"700",color:"#C2410C",marginBottom:"6px"},"⚠️ Atenção"));
  aviso.appendChild(div({fontSize:"12px",color:"#92400E",lineHeight:"1.6"},"Alterar os valores afeta apenas os cálculos futuros e a visualização dos totais. Os registros já salvos mantêm o valor de comissão com que foram cadastrados."));
  wrap.appendChild(aviso);

  return wrap;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
const MENU=[
  {id:"dashboard",label:"📊 Análise"},
  {id:"registrar",label:"➕ Cadastro"},
  {id:"calendario",label:"📅 Calendário"},
  {id:"metas",label:"🎯 Metas"},
  {id:"relatorio",label:"📋 Relatório"},
  {id:"jornada",label:"⏱️ Jornada"},
  {id:"posvendas",label:"🤝 Pós-Vendas"},
  {id:"mapa",label:"🗺️ Mapa"},
  {id:"comissoes",label:"💲 Comissões"},
];

function render(){
  const ch=chAtual();
  const m=calcMes(ch);
  const pct=m.pct;
  const bateu=m.total>=m.meta.valor&&m.meta.valor>0;
  const app=document.getElementById("app");
  app.innerHTML="";

  // Modals
  if(state.showModalMeta)app.appendChild(renderModalMeta(false));
  if(state.showModalEditMeta)app.appendChild(renderModalMeta(true));
  if(state.showModalCliente)app.appendChild(renderModalCliente(null,addCliente,()=>setState({showModalCliente:false})));
  if(state.editandoCliente)app.appendChild(renderModalCliente(state.editandoCliente,d=>editCliente(state.editandoCliente.id,d),()=>setState({editandoCliente:null})));
  if(state.editandoJornada)app.appendChild(renderModalEditJornada(state.editandoJornada));

  // Modal Jornada
  if(state.showModalJornada){
    const h2=hoje();
    app.appendChild(modalWrap(state.jornadaAtiva?"⏱️ Em Andamento":"⏱️ Jornada de Trabalho",()=>setState({showModalJornada:false}),
      div({textAlign:"center",padding:"10px 0"},
        div({fontSize:"32px",marginBottom:"8px"},state.jornadaAtiva?"🟢":"⚪"),
        div({fontSize:"14px",color:C.suave,marginBottom:"4px"},h2.toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"})),
        div({fontSize:"28px",fontWeight:"800",color:C.texto,marginBottom:"16px"},h2.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})),
        state.jornadaAtiva?div({fontSize:"12px",color:C.suave,marginBottom:"12px"},"Início: "+new Date(state.jornadaAtiva.inicio).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})):null,
        btn(state.jornadaAtiva?"⏹ Finalizar Trabalho":"▶ Iniciar Trabalho",state.jornadaAtiva?finalizarJornada:iniciarJornada,{width:"100%",padding:"14px",background:state.jornadaAtiva?C.vermelho:C.verde,color:C.branco,borderRadius:"10px",fontSize:"15px",fontWeight:"700"})
      )
    ));
  }

  // Confirm delete
  if(state.confirmarDel){
    const bg=div({position:"fixed",inset:"0",background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px",zIndex:"300"});
    const box=div({background:C.branco,borderRadius:"16px",padding:"24px",width:"100%",maxWidth:"320px"});
    box.appendChild(div({fontSize:"16px",fontWeight:"700",color:C.texto,marginBottom:"8px"},"Remover registro?"));
    box.appendChild(div({fontSize:"13px",color:C.suave,marginBottom:"20px"},"Esta ação não pode ser desfeita."));
    const btns=div({display:"flex",gap:"10px"});
    btns.appendChild(btn("Cancelar",()=>setState({confirmarDel:null}),{flex:"1",padding:"12px",borderRadius:"8px",border:"1px solid #E5E7EB",background:C.branco,fontSize:"14px"}));
    btns.appendChild(btn("Remover",()=>deletar(state.confirmarDel),{flex:"1",padding:"12px",borderRadius:"8px",background:C.vermelho,color:C.branco,fontSize:"14px",fontWeight:"700"}));
    box.appendChild(btns);bg.appendChild(box);app.appendChild(bg);
  }

  // Navegação principal compacta, sem menu lateral
  const hdr=div({background:C.verde,padding:"16px",color:C.branco});
  hdr.appendChild(div({fontSize:"10px",opacity:"0.8",letterSpacing:"1px",textTransform:"uppercase"},"Minhas Indicações"));
  hdr.appendChild(div({fontSize:"18px",fontWeight:"800"},"Ton Maquininhas"));
  app.appendChild(hdr);

  const nav=div({display:"flex",gap:"7px",padding:"10px 12px",background:C.branco,overflowX:"auto",borderBottom:"1px solid #E5E7EB"});
  MENU.forEach(({id,label})=>nav.appendChild(btn(label,()=>setState({aba:id,showFAB:false}),{
    flex:"0 0 auto",padding:"8px 11px",borderRadius:"99px",background:state.aba===id?C.verde:C.cinza,
    color:state.aba===id?C.branco:C.texto,fontSize:"11px",fontWeight:state.aba===id?"700":"600"
  })));
  app.appendChild(nav);

  // Resumo financeiro fica somente na tela de análise
  if(state.aba==="dashboard"){
    const prog=div({background:C.verdeEscuro,padding:"10px 16px 12px"});
    const pRow=div({display:"flex",justifyContent:"space-between",color:C.branco,fontSize:"11px",marginBottom:"6px",opacity:"0.9"});
    pRow.appendChild(h("span",{},"Ganhos: "+fmtR(m.total)));
    pRow.appendChild(h("span",{},"Meta financeira: "+(m.meta.valor>0?fmtR(m.meta.valor):"não definida")));
    const pb=div({background:"rgba(255,255,255,0.2)",borderRadius:"99px",height:"7px"});
    pb.appendChild(div({width:pct+"%",height:"100%",background:bateu?"#FFD700":C.branco,borderRadius:"99px"}));
    prog.append(pRow,pb,div({color:C.branco,fontSize:"10px",marginTop:"5px",opacity:"0.8",textAlign:"center"},bateu?"🏆 Meta financeira batida":"Valores como consequência das vendas"));
    app.appendChild(prog);
  }
  app.appendChild(div({padding:"11px 16px 0",fontSize:"14px",fontWeight:"700",color:C.texto},MENU.find(x=>x.id===state.aba)?.label||""));

  // Conteúdo
  const content=div({padding:"10px 14px 0",paddingBottom:"100px"});
  if(state.aba==="dashboard")content.appendChild(renderDashboard());
  else if(state.aba==="registrar")content.appendChild(renderCadastro());
  else if(state.aba==="calendario")content.appendChild(renderCalendario());
  else if(state.aba==="metas")content.appendChild(renderMetas());
  else if(state.aba==="relatorio")content.appendChild(renderRelatorio());
  else if(state.aba==="jornada")content.appendChild(renderJornada());
  else if(state.aba==="posvendas")content.appendChild(renderPosVendas());
  else if(state.aba==="mapa")content.appendChild(renderMapa());
  else if(state.aba==="comissoes")content.appendChild(renderComissoes());
  app.appendChild(content);

  // FAB sub-items
  if(state.showFAB){
    const fabItems=div({position:"fixed",bottom:"100px",right:"16px",display:"flex",flexDirection:"column",gap:"8px",alignItems:"flex-end",zIndex:"150"});
    fabItems.appendChild(btn("👤 Cadastrar Cliente",()=>setState({showModalCliente:true,showFAB:false}),{display:"flex",alignItems:"center",gap:"8px",background:C.branco,border:"none",borderRadius:"24px",padding:"10px 16px",boxShadow:"0 4px 16px rgba(0,0,0,0.15)",fontSize:"13px",fontWeight:"600",color:C.texto}));
    fabItems.appendChild(btn("💼 Trabalhando",()=>setState({showModalJornada:true,showFAB:false}),{display:"flex",alignItems:"center",gap:"8px",background:C.branco,border:"none",borderRadius:"24px",padding:"10px 16px",boxShadow:"0 4px 16px rgba(0,0,0,0.15)",fontSize:"13px",fontWeight:"600",color:C.texto}));
    app.appendChild(fabItems);
  }

  // FAB main
  const fab=div({position:"fixed",bottom:"20px",right:"16px",display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"8px",zIndex:"160"});
  if(state.jornadaAtiva){
    fab.appendChild(btn("🚶",()=>setState({showModalJornada:true}),{width:"44px",height:"44px",borderRadius:"50%",background:C.vermelho,border:"none",cursor:"pointer",boxShadow:"0 4px 16px rgba(0,0,0,0.2)",fontSize:"20px",display:"flex",alignItems:"center",justifyContent:"center"}));
  }
  fab.appendChild(btn(state.showFAB?"✕":"+",()=>setState({showFAB:!state.showFAB}),{width:"56px",height:"56px",borderRadius:"50%",background:C.verde,border:"none",cursor:"pointer",boxShadow:"0 4px 20px rgba(0,168,104,0.4)",fontSize:"26px",fontWeight:"700",color:C.branco,display:"flex",alignItems:"center",justifyContent:"center"}));
  app.appendChild(fab);
}

render();
</script>
</body>
</html>
