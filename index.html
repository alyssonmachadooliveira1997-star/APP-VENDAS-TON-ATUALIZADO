function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function getC(){return load("ton_com",{Smart:240,T3:200,bonus:100,cada:3});}
function fmtR(v){return(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function fmtD(iso){return new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});}
function fmtDH(iso){return new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});}
function fmtHM(iso){return new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});}
function chStr(a,m){return a+"-"+String(m+1).padStart(2,"0");}
function nomeMesAno(a,m){return new Date(a,m,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"});}
function hoje(){return new Date();}
function chAtual(){const d=hoje();return chStr(d.getFullYear(),d.getMonth());}
function diasUteisMes(ano,mes){
  const dias=[];const d=new Date(ano,mes,1);
  while(d.getMonth()===mes){if(d.getDay()!==0&&d.getDay()!==6)dias.push(new Date(d));d.setDate(d.getDate()+1);}
  return dias;
}
function diasUteisRestantes(){
  const h=hoje(),fim=new Date(h.getFullYear(),h.getMonth()+1,0);
  let d=0,x=new Date(h);x.setDate(x.getDate()+1);
  while(x<=fim){if(x.getDay()!==0&&x.getDay()!==6)d++;x.setDate(x.getDate()+1);}return d;
}
function diasComSabRestantes(){
  const h=hoje(),fim=new Date(h.getFullYear(),h.getMonth()+1,0);
  let d=0,x=new Date(h);x.setDate(x.getDate()+1);
  while(x<=fim){if(x.getDay()!==0)d++;x.setDate(x.getDate()+1);}return d;
}
function isoParaData(iso){return iso?iso.split("T")[0]:"";}

// ── STATE ────────────────────────────────────────────────────────────────────
let S={
  registros:load("ton_reg",[]),
  metas:load("ton_metas",{}),
  jornadas:load("ton_jornadas",[]),
  jornadaAtiva:load("ton_jativa",null),
  contatos:load("ton_cont",{}),
  aba:"analise",
  modal:null, // {tipo, dados}
  selReg:{a:hoje().getFullYear(),m:hoje().getMonth()},
  selMeta:{a:hoje().getFullYear(),m:hoje().getMonth()},
  selRel:{a:hoje().getFullYear(),m:hoje().getMonth()},
  selMapa:{a:hoje().getFullYear(),m:hoje().getMonth()},
  selJor:{a:hoje().getFullYear(),m:hoje().getMonth()},
  mapaTodos:false,
  posVendasFiltro:"pendentes",
  editJornada:null,
};

function set(patch){
  Object.assign(S,patch);
  if(patch.registros)save("ton_reg",S.registros);
  if(patch.metas)save("ton_metas",S.metas);
  if(patch.jornadas)save("ton_jornadas",S.jornadas);
  if(patch.jornadaAtiva!==undefined)save("ton_jativa",S.jornadaAtiva);
  if(patch.contatos)save("ton_cont",S.contatos);
  render();
}

// ── CALCULOS ─────────────────────────────────────────────────────────────────
function calcMes(ch){
  const c=getC();
  const cli=S.registros.filter(r=>r.mes===ch&&r.tipo==="cli");
  const be=S.registros.filter(r=>r.mes===ch&&r.tipo==="bex");
  const com=cli.reduce((s,r)=>s+(r.comissao||0),0);
  const bauto=Math.floor(cli.length/c.cada)*c.bonus;
  const bext=be.reduce((s,r)=>s+(r.valor||0),0);
  const total=com+bauto+bext;
  const meta=S.metas[ch]||{vendas:0,valor:0};
  const pct=meta.vendas>0?Math.min(100,(cli.length/meta.vendas)*100):0;
  const pctVal=meta.valor>0?Math.min(100,(total/meta.valor)*100):0;
  return{cli,be,com,bauto,bext,total,meta,pct,pctVal,
    smart:cli.filter(r=>r.equip==="Smart").length,
    t3:cli.filter(r=>r.equip==="T3").length};
}

// ── DOM HELPERS ───────────────────────────────────────────────────────────────
function el(tag,attr,...ch){
  const e=document.createElement(tag);
  if(attr)Object.entries(attr).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="cls")e.className=v;
    else if(k==="html")e.innerHTML=v;
    else e.setAttribute(k,v);
  });
  ch.flat(3).forEach(c=>{if(c!=null&&c!==false)e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);});
  return e;
}
function dv(st,...ch){return el("div",{style:st},...ch);}
function sp(txt,st){return el("span",{style:st},txt);}
function btn(txt,cb,st,cls){return el("button",{onclick:cb,style:Object.assign({cursor:"pointer",border:"none",fontFamily:"inherit"},st||{}),cls:cls||""},txt);}
function inp(ph,val,cb,st){
  const i=el("input",{placeholder:ph,cls:"inp",style:st||{}});
  i.value=val||"";i.addEventListener("input",cb);return i;
}
function lbl(txt){return el("label",{cls:"lbl"},txt);}
function sep(){return dv({height:"1px",background:"#F0F2F5",margin:"8px 0"});}
function rowItem(l,v,cor,bold){
  return dv({display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"8px"},
    sp(l,{fontSize:"13px",color:CV.suave}),
    sp(v,{fontSize:"13px",fontWeight:bold?"700":"500",color:cor||CV.texto})
  );
}
function secCard(title,...ch){
  const c=dv({background:CV.branco,borderRadius:"16px",padding:"16px",marginBottom:"12px",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"});
  if(title)c.appendChild(dv({fontSize:"13px",fontWeight:"700",color:CV.texto,marginBottom:"10px"},title));
  ch.flat(2).forEach(x=>{if(x)c.appendChild(x);});
  return c;
}
function mesAnoSel(a,m,cb){
  const meses=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  const anos=[2026,2027,2028];
  const wr=dv({display:"flex",gap:"8px",marginBottom:"12px"});
  const sm=el("select",{cls:"sel"});meses.forEach((n,i)=>{const o=el("option",{value:i},n);if(i===m)o.selected=true;sm.appendChild(o);});
  sm.addEventListener("change",e=>cb(a,parseInt(e.target.value)));
  const sa=el("select",{cls:"sel"});anos.forEach(y=>{const o=el("option",{value:y},String(y));if(y===a)o.selected=true;sa.appendChild(o);});
  sa.addEventListener("change",e=>cb(parseInt(e.target.value),m));
  wr.append(sm,sa);return wr;
}

// ── MODALS ────────────────────────────────────────────────────────────────────
function showModal(tipo,dados){set({modal:{tipo,dados}});}
function closeModal(){set({modal:null});}

function buildModal(titulo,onClose,...children){
  const bg=dv({position:"fixed",inset:"0",background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"flex-end",justifyContent:"center",zIndex:"400",padding:"0"});
  bg.addEventListener("click",e=>{if(e.target===bg)onClose();});
  const box=dv({background:CV.branco,borderRadius:"20px 20px 0 0",padding:"20px",width:"100%",maxWidth:"480px",maxHeight:"90vh",overflowY:"auto"});
  box.appendChild(dv({width:"40px",height:"4px",background:"#E5E7EB",borderRadius:"99px",margin:"0 auto 16px"}));
  if(titulo)box.appendChild(dv({display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px"},
    dv({fontSize:"16px",fontWeight:"800",color:CV.texto},titulo),
    btn("✕",onClose,{background:"none",fontSize:"20px",color:CV.suave})
  ));
  children.flat(3).forEach(c=>{if(c)box.appendChild(c);});
  bg.appendChild(box);return bg;
}

function modalCliente(inicial,onSave,onClose){
  const c=getC();
  let nome=inicial?.nome||"",bairro=inicial?.bairro||"",equip=inicial?.equip||"Smart",wpp=inicial?.whatsapp||"",cep=inicial?.cep||"",dataVenda=inicial?.dataVenda||isoParaData(new Date().toISOString());
  const iNome=inp("Nome do cliente",nome,e=>nome=e.target.value);
  const iBairro=inp("Bairro",bairro,e=>bairro=e.target.value);
  const iWpp=inp("5511999999999",wpp,e=>wpp=e.target.value.replace(/\D/g,""));
  const iCep=inp("00000000",cep,e=>cep=e.target.value.replace(/\D/g,"").slice(0,8));
  const iData=el("input",{type:"date",cls:"inp"});iData.value=dataVenda;iData.addEventListener("change",e=>dataVenda=e.target.value);
  const tipoWr=dv({display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"14px"});
  function renderTipo(){
    tipoWr.innerHTML="";
    ["Smart","T3"].forEach(t=>{
      const b=dv({padding:"12px 8px",border:"2px solid "+(equip===t?CV.verde:"#E5E7EB"),borderRadius:"12px",background:equip===t?CV.vfundo:CV.branco,cursor:"pointer",textAlign:"center",transition:"all 0.2s"});
      b.appendChild(dv({fontSize:"15px",fontWeight:"800",color:equip===t?CV.verde:CV.suave},t));
      b.appendChild(dv({fontSize:"12px",color:equip===t?CV.vesc:CV.suave},fmtR(c[t])));
      b.addEventListener("click",()=>{equip=t;renderTipo();});
      tipoWr.appendChild(b);
    });
  }
  renderTipo();
  const bSalvar=btn(inicial?"Salvar Alterações":"Cadastrar Cliente",()=>{
    if(!nome.trim()||!bairro.trim())return alert("Preencha nome e bairro.");
    onSave({nome:nome.trim(),bairro:bairro.trim(),equip,comissao:c[equip],whatsapp:wpp,cep,dataVenda});
  },{width:"100%",padding:"14px",background:CV.verde,color:CV.branco,borderRadius:"12px",fontSize:"15px",fontWeight:"700"});
  return buildModal(inicial?"✏️ Editar Cliente":"👤 Cadastrar Cliente",onClose,
    lbl("Nome *"),iNome,lbl("Bairro *"),iBairro,
    lbl("Data da Venda"),iData,
    lbl("WhatsApp"),iWpp,lbl("CEP"),iCep,
    lbl("Equipamento *"),tipoWr,bSalvar
  );
}

function modalMeta(isEdit,onClose){
  const ch=chAtual();
  const atual=S.metas[ch]||{vendas:0};
  let vendas=isEdit?atual.vendas:0;
  const c=getC();
  const du=diasUteisMes(hoje().getFullYear(),hoje().getMonth());
  const prev=dv({background:CV.vfundo,borderRadius:"10px",padding:"12px",marginBottom:"14px"});
  function updatePrev(){
    prev.innerHTML="";
    const vd=du.length>0?(vendas/du.length).toFixed(1):0;
    const valEst=Math.round(vendas/c.cada)*c.bonus+vendas*((c.Smart+c.T3)/2);
    prev.appendChild(dv({fontSize:"11px",color:CV.vesc,fontWeight:"600",marginBottom:"6px"},"📊 Projeção"));
    prev.appendChild(dv({display:"flex",justifyContent:"space-around",textAlign:"center"},
      dv({},dv({fontSize:"22px",fontWeight:"800",color:CV.verde},String(vendas)),dv({fontSize:"10px",color:CV.suave},"vendas/mês")),
      dv({width:"1px",background:CV.verde+"30"}),
      dv({},dv({fontSize:"22px",fontWeight:"800",color:CV.verde},String(vd)),dv({fontSize:"10px",color:CV.suave},"vendas/dia")),
      dv({width:"1px",background:CV.verde+"30"}),
      dv({},dv({fontSize:"16px",fontWeight:"800",color:CV.verde},du.length+"d"),dv({fontSize:"10px",color:CV.suave},"dias úteis"))
    ));
  }
  updatePrev();
  const iVendas=el("input",{type:"number",min:"0",placeholder:"Ex: 30",cls:"inp",style:{fontSize:"24px",fontWeight:"800",textAlign:"center",color:CV.verde,border:"2px solid "+CV.verde}});
  iVendas.value=vendas||"";
  iVendas.addEventListener("input",e=>{vendas=parseInt(e.target.value)||0;updatePrev();});
  const bSalvar=btn("Confirmar Meta",()=>{
    if(!vendas)return alert("Informe a quantidade de vendas.");
    const c2=getC();
    const valEst=Math.round(vendas/c2.cada)*c2.bonus+vendas*((c2.Smart+c2.T3)/2);
    const obj={vendas,valor:valEst,cadastradoEm:isEdit?undefined:new Date().toISOString()};
    if(isEdit&&S.metas[ch])obj.cadastradoEm=S.metas[ch].cadastradoEm;
    set({metas:{...S.metas,[ch]:obj},modal:null});
  },{width:"100%",padding:"14px",background:CV.verde,color:CV.branco,borderRadius:"12px",fontSize:"15px",fontWeight:"700"});
  return buildModal("🎯 Meta do Mês",onClose,
    lbl("Quantas vendas você quer fazer este mês?"),
    iVendas,prev,bSalvar
  );
}

function modalBonusExtra(mes,onClose){
  let tipo="",val="";
  const iTipo=inp("Ex: Campanha de aceleração",tipo,e=>tipo=e.target.value);
  const iVal=inp("Valor R$",val,e=>val=e.target.value.replace(/[^0-9,.]/g,""));
  const bSalvar=btn("Registrar Bônus",()=>{
    const v=parseFloat(val.replace(",","."));
    if(!tipo.trim()||!v)return alert("Preencha tipo e valor.");
    const novo={id:Date.now(),tipo:"bex",bonusTipo:tipo.trim(),valor:v,data:new Date().toISOString(),mes};

  const ch=chAtual();const m=calcMes(ch);const c=getC();

  const du=diasUteisMes(h2.getFullYear(),h2.getMonth());
  const diaAtualIdx=du.findIndex(d=>d.getDate()===h2.getDate()&&d.getMonth()===h2.getMonth());

  const metaDiaria=du.length>0?(metaVendas/du.length).toFixed(1):0;
  const restantes=getDiasUteisRestantes2();

  const metaDiariaRest=restantes>0?(vendFalta/restantes).toFixed(1):0;
  const esperadoHoje=du.length>0?Math.round((metaVendas/du.length)*duPassados):0;
  const statusMTD=m.cli.length>=esperadoHoje?"ahead":"behind";

    const acum=du.slice(0,i+1).reduce((s,dd)=>{

      return s+S.registros.filter(r=>r.tipo==="cli"&&r.mes===ch&&(r.dataVenda||r.data.split("T")[0])===dds).length;
    },0);

  // Cards valores (secundários)

function getDiasUteisRestantes2(){
  const h=hoje(),fim=new Date(h.getFullYear(),h.getMonth()+1,0);
  let d=0,x=new Date(h);x.setDate(x.getDate()+1);
  while(x<=fim){if(x.getDay()!==0&&x.getDay()!==6)d++;x.setDate(x.getDate()+1);}return d;
}

  // Resumo

function exportar(){
  const blob=new Blob([JSON.stringify({registros:S.registros,metas:S.metas,jornadas:S.jornadas,comissoes:getC(),exportadoEm:new Date().toISOString()},null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download="ton-backup-"+new Date().toISOString().split("T")[0]+".json";
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
function importar(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.registros||!d.metas)throw 0;
      if(confirm("Importar backup? Substituirá os dados atuais.")){
        set({registros:d.registros,metas:d.metas,jornadas:d.jornadas||[]});
        if(d.comissoes)save("ton_com",d.comissoes);
        alert("Importado!");
      }
    }catch{alert("Arquivo inválido.");}
  };reader.readAsText(file);
}

    });
  }
  if(S.jornadaAtiva)fabWrap.appendChild(btn("🚶",()=>showModal("jornada",null),{width:"42px",height:"42px",borderRadius:"50%",background:CV.verm,color:CV.branco,fontSize:"18px",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 3px 12px rgba(239,68,68,0.4)"}));
  fabWrap.appendChild(btn(S.showFAB?"✕":"+",()=>set({showFAB:!S.showFAB}),{width:"52px",height:"52px",borderRadius:"50%",background:CV.verde,color:CV.branco,fontSize:S.showFAB?"20px":"28px",fontWeight:"700",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 18px rgba(0,168,104,0.45)"}));
  app.appendChild(fabWrap);

  // Tab bar
  const tabBar=dv({display:"flex",background:CV.branco,borderTop:"1px solid #E5E7EB",position:"fixed",bottom:"0",left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:"480px",zIndex:"100",padding:"4px 0 6px",overflowX:"auto"});
  tabBar.style.scrollbarWidth="none";
  TABS.forEach(({id,icon,label})=>{
    const b=dv({display:"flex",flexDirection:"column",alignItems:"center",gap:"2px",padding:"6px 8px",cursor:"pointer",minWidth:"52px",flex:"0 0 auto"});
    b.appendChild(dv({fontSize:"20px",lineHeight:"1"},icon));
    b.appendChild(dv({fontSize:"9px",fontWeight:"600",color:S.aba===id?CV.verde:"#9CA3AF"},label));
    if(S.aba===id){
      const dot=dv({width:"4px",height:"4px",borderRadius:"50%",background:CV.verde,margin:"2px auto 0"});
      b.appendChild(dot);
    }
    b.addEventListener("click",()=>set({aba:id,showFAB:false}));
    tabBar.appendChild(b);
  });
  app.appendChild(tabBar);
}

render();
</script>
</body>
</html>
